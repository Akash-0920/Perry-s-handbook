<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perry's Unit Converter</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ac:#0b63ce;--bd:#d8dce3;--hi:#e8f1fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181e26;--tx:#e8ecf2;--mut:#93a0b3;--ac:#5aa2ff;--bd:#2b3441;--hi:#1b2a40}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#181e26;--tx:#e8ecf2;--mut:#93a0b3;--ac:#5aa2ff;--bd:#2b3441;--hi:#1b2a40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:4px 0 10px}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;max-height:150px;overflow:auto}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:8px}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-top:10px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
button.sw{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:10px 12px;font-size:16px;cursor:pointer}
.res{margin-top:14px;padding:12px;border-radius:10px;background:var(--hi);font-size:22px;font-weight:600;word-break:break-all}
.res small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.tw{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
td{padding:6px 4px;border-bottom:1px solid var(--bd)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.cur td{color:var(--ac);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(max-width:480px){.g2{grid-template-columns:1fr}}</style></head><body><main>
<h1>⚙️ Perry's Unit Converter</h1>
<input id="q" placeholder="Search category or unit (flow, lpm, psi, kcal…)" autocomplete="off">
<div class="chips" id="chips"></div>
<div class="card">
<label>Value</label><input id="v" type="number" step="any" value="1" inputmode="decimal">
<div class="row"><div><label>From</label><select id="f"></select></div><button class="sw" id="sw" title="Swap">⇄</button><div><label>To</label><select id="t"></select></div></div>
<div class="res" id="r"></div>
<div class="note" id="n"></div>
<div class="tw"><table id="tb"></table></div>
</div>
<div class="card"><b>🛢️ Cylinder volume</b>
<div class="row" style="grid-template-columns:1fr"><div><label>Diameter</label><div style="display:flex;gap:4px"><input id="cd" type="number" step="any" inputmode="decimal" style="min-width:0"><select id="cdu" style="width:68px;padding:10px 4px"><option value="1" >m</option><option value=".001">mm</option><option value=".01">cm</option><option value=".3048">ft</option><option value=".0254" selected>in</option></select></div></div><div><label>Length / Height</label><div style="display:flex;gap:4px"><input id="cl" type="number" step="any" inputmode="decimal" style="min-width:0"><select id="clu" style="width:68px;padding:10px 4px"><option value="1" selected>m</option><option value=".001">mm</option><option value=".01">cm</option><option value=".3048">ft</option><option value=".0254" >in</option></select></div></div><div><label>Liquid level (optional)</label><div style="display:flex;gap:4px"><input id="cv" type="number" step="any" inputmode="decimal" style="min-width:0"><select id="cvu" style="width:68px;padding:10px 4px"><option value="1" >m</option><option value=".001">mm</option><option value=".01">cm</option><option value=".3048">ft</option><option value=".0254" >in</option></select></div></div><div><label>Orientation</label><select id="co"><option value="v">Vertical</option><option value="h">Horizontal</option></select></div></div>
<div class="tw"><table id="ct"></table></div>
<div class="note">Level from bottom. Plain cylinder (no dished heads). Each field has its own unit.</div></div>
<div class="card"><b>🧮 Process calculators</b><div class="g2"><div><label>Group</label><select id="tg"></select></div><div><label>Calculator</label><select id="tn"></select></div></div><div class="g2" id="tf"></div><div class="tw"><table id="tr"></table></div><div class="note" id="tnote"></div></div>
</main>

{g:'Heat transfer & utilities',n:'Saturated steam (approx.)',f:[['m','Mode',0,[['T °C → P',0],['P bar a → T',1]]],['x','Value (°C or bar a)',150]],c:v=>{let T,P;if(v.m==0){T=v.x;const a=ant(T);P=Math.pow(10,a[0]-a[1]/(a[2]+T))*133.322e-5}else{P=v.x;const mm=P/133.322e-5,a=ant(mm>760?150:50);T=a[1]/(a[0]-Math.log10(mm))-a[2]}const l=2257*Math.pow(Math.max(0,(374.15-T)/274.15),.38);return[['T sat °C',T],['P sat bar a',P],['P sat kg/cm² a',P*1.01972],['Latent heat kJ/kg',l],['Latent heat kcal/kg',l/4.1868]]},note:'Antoine + Watson fits; ±1%. Use IAPWS tables for design.'},
{g:'Heat transfer & utilities',n:'Heater efficiency (O₂, stack)',f:[['o','Flue O₂ % (dry)',3],['ts','Stack T °C',300],['ta','Air T °C',30],['fu','Fuel',0,[['Fuel gas',0],['Fuel oil',1]]]],c:v=>{const A=v.fu==0?.66:.68,B=v.fu==0?.009:.007,l=(v.ts-v.ta)*(A/(21-v.o)+B);return[['Excess air %',v.o/(20.9-v.o)*100],['Stack loss % (Siegert)',l],['Efficiency % (ex radiation)',100-l]]}},
{g:'Heat transfer & utilities',n:'Fuel gas MW & LHV',f:[['h2','H₂ mol%',20],['c1','CH₄ mol%',60],['c2','C₂H₆ mol%',10],['c3','C₃H₈ mol%',7],['c4','C₄H₁₀ mol%',3]],c:v=>{const s=v.h2+v.c1+v.c2+v.c3+v.c4,m=(v.h2*2.016+v.c1*16.043+v.c2*30.07+v.c3*44.097+v.c4*58.123)/s,l=(v.h2*10.78+v.c1*35.8+v.c2*63.7+v.c3*91.3+v.c4*118.5)/s;return[['Sum mol%',s],['MW',m],['LHV MJ/Nm³',l],['LHV kcal/Nm³',l*238.846],['LHV kcal/kg',l*238.846*22.414/m]]}},
{g:'Safety',n:'PSV fire case & orifice (API 521/520)',f:[['A','Wetted area m²',50],['q','Fire basis',0,[['43.2 (drainage + fire-fighting)',0],['70.9 (poor drainage)',1]]],['F','Env. factor F',1],['lam','Latent heat kJ/kg',300],['M','Vapour MW',100],['T','Relieving T K',400],['k','Cp/Cv k',1.1],['Z','Z',1],['ps','Set pressure barg',10],['ac','Accumulation %',21],['kd','Kd',.975],['kb','Kb',1]],c:v=>{const Q=(v.q==0?43.2:70.9)*v.F*Math.pow(v.A,.82),W=Q*3600/v.lam,P1=v.ps*(1+v.ac/100)*100+101.325,C=.03948*Math.sqrt(v.k*Math.pow(2/(v.k+1),(v.k+1)/(v.k-1))),a=W/(C*v.kd*P1*v.kb)*Math.sqrt(v.T*v.Z/v.M),o=OR.find(x=>x[1]>=a);return[['Heat input kW',Q],['Relief load kg/h',W],['P1 kPa a',P1],['C coeff',C],['Req. area mm²',a],['API orifice',o?o[0]+' ('+o[1]+' mm²)':'> T, use multiple']]},note:'Wetted area, fluid data are user inputs. Vapour sizing, Kc=1. Verify with full API 520/521 study.'},
{g:'Safety',n:'SIS PFDavg / SIL',f:[['ti','Proof test interval yr',1],['s','Sensor λDU /yr',.02],['sa','Sensor arch',1,arch],['l','Logic λDU /yr',.002],['e','Final element λDU /yr',.05],['ea','Final element arch',1,arch]],c:v=>{const a=pf(v.sa,v.s,v.ti),b=v.l*v.ti/2,c=pf(v.ea,v.e,v.ti),t=a+b+c,sil=t<1e-4?'SIL 4':t<1e-3?'SIL 3':t<1e-2?'SIL 2':t<1e-1?'SIL 1':'< SIL 1';return[['PFD sensor',a],['PFD logic',b],['PFD final element',c],['PFDavg loop',t],['RRF',1/t],['Achieved',sil]]},note:'Simplified (no CCF/β, MTTR). For SIL verification use full IEC 61508 calc.'},
{g:'Process',n:'Blending (RVP, viscosity, SG)',f:[...[1,2,3].flatMap(i=>[['v'+i,'Comp '+i+' vol%',[50,30,20][i-1]],['r'+i,'  RVP psi',[8,5,2][i-1]],['n'+i,'  Visc cSt',[5,20,100][i-1]],['s'+i,'  SG',[.7,.75,.85][i-1]]])],c:v=>{let V=0,R=0,sg=0,m=0,vb=0;for(const i of[1,2,3])V+=v['v'+i];for(const i of[1,2,3]){const x=v['v'+i]/V,w=x*v['s'+i];R+=x*Math.pow(v['r'+i],1.25);sg+=w;m+=w;}for(const i of[1,2,3]){const w=v['v'+i]/V*v['s'+i]/m;vb+=w*(14.534*Math.log(Math.log(v['n'+i]+.8))+10.975)}return[['Blend RVP psi',Math.pow(R,.8)],['Blend RVP kPa',Math.pow(R,.8)*6.89476],['Blend visc cSt (Refutas)',Math.exp(Math.exp((vb-10.975)/14.534))-.8],['Blend SG',sg]]},note:'RVP via RVP^1.25 index; viscosity via Refutas, mass-weighted.'},
{g:'Process',n:'Yield / mass balance',f:[['F','Feed t/h',100],...[1,2,3,4,5].map(i=>['p'+i,'Product '+i+' t/h',[10,25,30,25,0][i-1]])],c:v=>{let s=0;const r=[];for(let i=1;i<=5;i++){s+=v['p'+i];r.push(['Product '+i+' yield wt%',v['p'+i]/v.F*100])}r.push(['Total products wt%',s/v.F*100],['Loss / gain wt%',(v.F-s)/v.F*100]);return r}},
{g:'Process',n:'H₂ consumption',f:[['F','Feed m³/h',100],['mu','Make-up gas Nm³/h',20000],['mp','Make-up purity vol%',95],['pu','Purge/off-gas Nm³/h',3000],['pp','Purge H₂ vol%',75]],c:v=>{const c=v.mu*v.mp/100-v.pu*v.pp/100;return[['H₂ consumed Nm³/h',c],['Nm³/m³ feed',c/v.F],['scf/bbl',c/v.F*5.6146]]},note:'Excludes dissolved H₂ losses in liquid products.'},
{g:'Process',n:'ASTM D86 ↔ TBP (Daubert)',f:[['d','Direction',0,[['D86 → TBP',0],['TBP → D86',1]]],...dd.map(x=>['t'+x[0],x[0]+'% °C',[60,90,120,150,180,220,250][dd.indexOf(x)]])],c:v=>dd.map(x=>{const R=(v['t'+x[0]]+273.15)*1.8,o=v.d==0?x[1]*Math.pow(R,x[2]):Math.pow(R/x[1],1/x[2]);return[x[0]+'% '+(v.d==0?'TBP':'D86')+' °C',o/1.8-273.15]}),note:'At 760 mmHg; temperatures are 0–95% points.'}
];
const gs=[...new Set(TL.map(x=>x.g))];
function tlInit(){$('tg').innerHTML=gs.map(g=>`<option>${g}</option>`).join('');tgSet();}
function tgSet(){$('tn').innerHTML=TL.map((x,i)=>x.g===$('tg').value?`<option value="${i}">${x.n}</option>`:'').join('');tnSet();}
function tnSet(){const t=TL[$('tn').value];$('tf').innerHTML=t.f.map(f=>`<div><label>${f[1]}</label>${f[3]?`<select data-k="${f[0]}">${f[3].map(o=>`<option value="${o[1]}"${o[1]==f[2]?' selected':''}>${o[0]}</option>`).join('')}</select>`:`<input data-k="${f[0]}" type="number" step="any" inputmode="decimal" value="${f[2]}">`}</div>`).join('');$('tf').querySelectorAll('input,select').forEach(e=>e.oninput=tCalc);$('tnote').textContent=t.note||'';tCalc();}
function tCalc(){const t=TL[$('tn').value],v={};let ok=1;$('tf').querySelectorAll('input,select').forEach(e=>{v[e.dataset.k]=parseFloat(e.value);if(isNaN(v[e.dataset.k]))ok=0});if(!ok){$('tr').innerHTML='';return}let r;try{r=t.c(v)}catch(x){r=[['Error','check inputs']]}$('tr').innerHTML=r.map(x=>`<tr><td>${x[0]}</td><td>${typeof x[1]==='number'?fmt(x[1]):x[1]}</td></tr>`).join('');}
$('tg').onchange=tgSet;$('tn').onchange=tnSet;tlInit();
</script></body></html>
